[project]
name = "meeting-intel"
version = "0.1.0"
description = "Ask questions about your meeting transcripts, with cited answers."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "google-genai>=2.33.0",
    "numpy>=2.5.4",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "regex>=2026.9.29",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
